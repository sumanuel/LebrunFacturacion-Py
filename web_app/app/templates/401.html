{% extends "base.html" %} {% block title %}No autorizado - {{ app_name }}{%
endblock %} {% block content %}
<div class="container-fluid">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="text-center mt-5">
        <div class="error mx-auto" data-text="401">
          <h1 class="display-1 text-danger">401</h1>
        </div>
        <p class="lead text-gray-800 mb-5">No autorizado</p>
        <p class="text-gray-500 mb-4">
          Debe iniciar sesión para acceder a esta página.
        </p>
        <a href="{{ url_for('auth.login') }}" class="btn btn-primary btn-lg">
          <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
        </a>
      </div>
    </div>
  </div>
</div>

<style>
  .error {
    color: #5a5c69;
    font-size: 7rem;
    position: relative;
    line-height: 1;
    width: 12.5rem;
    margin: 0 auto;
  }

  .error::after {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: -webkit-linear-gradient(45deg, #5a5c69 25%, transparent 25%),
      -webkit-linear-gradient(-45deg, #5a5c69 25%, transparent 25%),
      -webkit-linear-gradient(45deg, transparent 75%, #5a5c69 75%),
      -webkit-linear-gradient(-45deg, transparent 75%, #5a5c69 75%);
    background-size: 2px 2px;
    background-position: 0 0, 0 1px, 1px -1px, -1px 0px;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    z-index: -1;
  }
</style>
{% endblock %}
